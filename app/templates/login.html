<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarberIA · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f2f2f7;
  --card:     #ffffff;
  --sep:      rgba(60,60,67,0.12);
  --label:    #1c1c1e;
  --label2:   #3c3c43;
  --label3:   rgba(60,60,67,0.50);
  --blue:     #007aff;
  --red:      #ff3b30;
  --red-bg:   rgba(255,59,48,0.08);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
  --r-md: 14px;
  --r-lg: 18px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.card {
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.logo {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.logo-icon {
  width: 56px; height: 56px; border-radius: 16px;
  background: var(--blue);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 4px 16px rgba(0,122,255,0.30);
}
.logo-name {
  font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--label);
}
.logo-sub {
  font-size: 13px; color: var(--label3); font-weight: 400;
  margin-top: -8px;
}
form {
  width: 100%; display: flex; flex-direction: column; gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px; font-weight: 600; color: var(--label2);
}
.field input {
  font-family: inherit;
  font-size: 15px;
  padding: 11px 14px;
  border: 1px solid var(--sep);
  border-radius: var(--r-md);
  background: var(--bg);
  color: var(--label);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  width: 100%;
}
.field input:focus {
  border-color: var(--blue);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
}
.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--r-md);
  font-family: inherit;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,122,255,0.30);
  transition: background .15s, transform .1s;
}
.btn-login:hover { background: #0071e3; }
.btn-login:active { transform: scale(.98); }
.error {
  width: 100%;
  background: var(--red-bg);
  border: 1px solid rgba(255,59,48,0.20);
  border-radius: var(--r-md);
  padding: 10px 14px;
  font-size: 13px; color: var(--red); font-weight: 500;
  text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">✂️</div>
    <div class="logo-name">BarberIA</div>
    <div class="logo-sub">Panel de administración</div>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Clave de acceso</label>
      <input
        type="password"
        name="key"
        placeholder="••••••••"
        autocomplete="current-password"
        autofocus
        required
      >
    </div>
    <button type="submit" class="btn-login">Ingresar</button>
  </form>
</div>
</body>
</html>
